name: Agent prompt pattern gate

# Fails when an agent prompt asks the model to show its reasoning (RIG-10290).
# The scanner imports only Bun builtins, so the job skips `bun install`.
# No paths filter: the check must post on every PR, as in ci.yml.

on:
  pull_request:
    branches: [rigel-release, main, omp2]
  push:
    branches: [rigel-release]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-prompt-pattern:
    name: Agent prompt pattern gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Test the gate
        run: bun test scripts/agent-prompt-pattern-gate.test.ts
      - name: Install pinned cue
        # Pinned release tarball, verified against the release's sha256 digest.
        env:
          CUE_VERSION: "0.17.1"
          CUE_SHA256: a39b0c97695069d95d276d99be0f5dbabb081d801bfdc9ba49b76efaf94e2369
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/cue.tar.gz" \
            "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_linux_amd64.tar.gz"
          echo "${CUE_SHA256}  $tmp/cue.tar.gz" | sha256sum --check --strict
          tar -xzf "$tmp/cue.tar.gz" -C "$tmp" cue
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmp/cue" "$HOME/.local/bin/cue"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check rendered config matches the CUE source
        run: |
          set -euo pipefail
          cue export scripts/agent-prompt-pattern-gate.cue -e config --out json \
            | diff - scripts/agent-prompt-pattern-gate.config.json
      - name: Scan agent prompts for reasoning wording
        run: bun scripts/agent-prompt-pattern-gate.ts
