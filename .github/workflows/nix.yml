name: OMP Nix

# Release tags, the nightly schedule, on-demand runs, and rigel-release
# pushes or PRs that touch the Nix build inputs below.
on:
  push:
    branches: [rigel-release]
    tags: ["v*"]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  pull_request:
    branches: [rigel-release]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Evaluate every supported system
        run: nix flake check --all-systems --no-build --show-trace
      - name: Verify generated Bun dependencies
        run: nix build --no-link .#checks.x86_64-linux.bun-lock --show-trace

  # Thin LTO exercises the same derivations as release builds at a fraction of
  # the link.
  build:
    name: Build package
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Build omp with thin LTO
        run: |
          out=$(nix build --no-link --print-out-paths --print-build-logs --show-trace --impure \
            --expr "(builtins.getFlake \"git+file://$GITHUB_WORKSPACE\").packages.x86_64-linux.omp.override { withFatLto = false; }")
          echo "OMP_OUT=$out" >> "$GITHUB_ENV"
      - name: Build binary package install check
        run: nix build --no-link .#checks.x86_64-linux.omp-bin
      - name: Smoke-test omp
        run: |
          "$OMP_OUT/bin/omp" --version
          "$OMP_OUT/bin/omp" --smoke-test

  # Pushes the omp closure to the private forks Attic cache, from the reusable
  # workflow in RigelBuild/.github. Push events only: a pull_request never
  # reaches this job, so fork PRs never get the secrets. Secrets are not yet
  # provisioned (RIG-10216, RIG-10509); until they exist, the reusable job
  # skips with a notice and does not fail this caller.
  attic-push:
    if: github.event_name == 'push'
    needs: [build]
    uses: RigelBuild/.github/.github/workflows/attic-push.yml@main
    with:
      attrs: |
        .#omp
      cache: forks
      nix-config: |
        accept-flake-config = true
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      ATTIC_PUSH_TOKEN: ${{ secrets.ATTIC_PUSH_TOKEN }}
