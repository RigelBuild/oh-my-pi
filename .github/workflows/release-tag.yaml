name: release-tag

# Runs only when the version file changes, so pushes without a release never reach the App key.
"on":
   pull_request:
      branches: [rigel-release]
      paths: [.github/rigel-version]
   push:
      branches: [rigel-release]
      paths: [.github/rigel-version]
   workflow_dispatch:

permissions:
   contents: read

jobs:
   check:
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0
              ref: ${{ github.event.pull_request.head.sha }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Validate a changed release version
           env:
              BASE_SHA: ${{ github.event.pull_request.base.sha }}
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
           run: bun scripts/release-tag.ts check-pr "$BASE_SHA" "$HEAD_SHA"

   mint:
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-22.04
      # The App key lives only in this environment, which admits only rigel-release.
      environment: rigel-release
      steps:
         - name: Require release-branch dispatch
           if: github.ref != 'refs/heads/rigel-release'
           run: |
              echo '::error::release-tag only mints from rigel-release' >&2
              exit 1
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         # An App token, unlike GITHUB_TOKEN, starts the tag's workflows and bypasses the tag ruleset.
         - name: Create scoped release App token
           id: app-token
           uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
           with:
              client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
              private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
              permission-contents: write
              permission-workflows: write
              repositories: oh-my-pi
         - name: Mint release tag if needed
           env:
              GH_TOKEN: ${{ steps.app-token.outputs.token }}
              RELEASE_SHA: ${{ github.sha }}
              RELEASE_REPOSITORY: ${{ github.repository }}
           run: bun scripts/release-tag.ts mint "$RELEASE_SHA" "$RELEASE_REPOSITORY"
