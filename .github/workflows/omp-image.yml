name: Publish OMP image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile.omp
      - .github/workflows/omp-image.yml
      - packages/**
      - crates/**
      - Cargo.lock
      - bun.lock

permissions:
  contents: read

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.omp
          platforms: linux/amd64
          push: false

  publish:
    name: Publish linux/amd64 image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.omp
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rigelbuild/omp:${{ github.sha }}
      - name: Expose image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Image: ghcr.io/rigelbuild/omp@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${IMAGE_DIGEST}"
